<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RILEY RESERVE</title>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --bg: #09090f;
  --surface: rgba(255,255,255,0.028);
  --surface-hover: rgba(255,255,255,0.045);
  --border: rgba(255,255,255,0.06);
  --border-accent: rgba(255,255,255,0.10);
  --text-primary: #e2e8f0;
  --text-secondary: rgba(255,255,255,0.50);
  --text-tertiary: rgba(255,255,255,0.28);
  --gold: #c9a54e;
  --gold-dim: rgba(201,165,78,0.15);
  --green: #4caf7c;
  --green-dim: rgba(76,175,124,0.14);
  --red: #cf5c5c;
  --red-dim: rgba(207,92,92,0.14);
  --amber: #e8a838;
  --amber-dim: rgba(232,168,56,0.14);
  --blue: #60a5fa;
  --blue-dim: rgba(96,165,250,0.14);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { background:var(--bg); color:var(--text-primary); font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; }
body { max-width:520px; margin:0 auto; padding:16px 16px 80px; }

.header { padding:20px 0 16px; border-bottom:1px solid var(--border); margin-bottom:20px; }
.header-title { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:600; letter-spacing:0.02em; }
.header-sub { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-tertiary); margin-top:4px; letter-spacing:0.5px; text-transform:uppercase; }

.month-nav { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.month-label { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:600; flex:1; }
.month-btn { background:var(--surface); border:1px solid var(--border); color:var(--text-secondary); border-radius:6px; padding:6px 12px; font-family:'JetBrains Mono',monospace; font-size:11px; cursor:pointer; transition:all 0.15s; }
.month-btn:hover { background:var(--surface-hover); color:var(--text-primary); }
.month-btn:disabled { opacity:0.25; cursor:default; }
.month-btn:disabled:hover { background:var(--surface); color:var(--text-secondary); }

.section-head { font-family:'Cormorant Garamond',serif; font-size:16px; font-weight:600; color:var(--text-primary); margin:28px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.section-head:first-of-type { margin-top:0; }

.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
.card-accent { border-left:3px solid var(--gold); }
.card-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.card-title { font-family:'Cormorant Garamond',serif; font-size:15px; font-weight:600; }
.card-badge { font-family:'JetBrains Mono',monospace; font-size:9px; padding:2px 8px; border-radius:10px; font-weight:600; letter-spacing:0.3px; }
.badge-green { background:var(--green-dim); color:var(--green); border:1px solid rgba(76,175,124,0.35); }
.badge-amber { background:var(--amber-dim); color:var(--amber); border:1px solid rgba(232,168,56,0.35); }
.badge-red { background:var(--red-dim); color:var(--red); border:1px solid rgba(207,92,92,0.35); }
.badge-blue { background:var(--blue-dim); color:var(--blue); border:1px solid rgba(96,165,250,0.35); }

.data-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin-bottom:10px; }
.data-grid-3 { grid-template-columns:1fr 1fr 1fr; }
.data-grid-4 { grid-template-columns:1fr 1fr 1fr 1fr; }
.data-key { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.4px; }
.data-val { font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; margin-top:2px; }
.data-val-sm { font-size:12px; }
.data-val-lg { font-size:18px; }
.data-compare { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-tertiary); margin-top:1px; }

/* Collapsible read panels */
.read-toggle { display:flex; align-items:center; gap:6px; margin-top:10px; padding:6px 0; cursor:pointer; border:none; background:none; color:var(--text-tertiary); font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:0.5px; width:100%; text-align:left; }
.read-toggle:hover { color:var(--text-secondary); }
.read-chevron { transition:transform 0.2s; font-size:8px; }
.read-toggle.open .read-chevron { transform:rotate(90deg); }
.read-panel { background:rgba(201,165,78,0.04); border-left:2px solid rgba(201,165,78,0.3); border-radius:0 6px 6px 0; padding:10px 12px; margin-top:6px; font-size:12px; line-height:1.65; color:var(--text-secondary); display:none; }
.read-panel.open { display:block; }
.read-panel strong { color:var(--text-primary); font-weight:500; }
.read-panel-blue { border-left-color:rgba(96,165,250,0.3); background:rgba(96,165,250,0.04); }

/* Household economy */
.econ-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.econ-cell { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; cursor:pointer; transition:background 0.15s; }
.econ-cell:hover { background:var(--surface-hover); }
.econ-cell-wide { grid-column:1 / -1; }
.econ-label { font-family:'JetBrains Mono',monospace; font-size:8px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.5px; }
.econ-value { font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; margin-top:4px; }
.econ-sub { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-tertiary); margin-top:2px; }
.econ-detail { display:none; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-secondary); line-height:1.6; }
.econ-detail.open { display:block; }
.econ-detail p { margin-bottom:8px; }
.econ-detail p:last-child { margin-bottom:0; }

.spend-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.03); }
.spend-row:last-child { border-bottom:none; }
.spend-rank { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-tertiary); width:16px; text-align:right; }
.spend-name { flex:1; font-size:13px; }
.spend-amount { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; }
.spend-delta { font-family:'JetBrains Mono',monospace; font-size:10px; margin-left:6px; min-width:48px; text-align:right; }

.macro-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
.macro-cell { background:var(--surface); border-radius:6px; padding:8px 10px; text-align:center; }
.macro-cell .data-key { font-size:8px; }
.macro-cell .data-val { font-size:13px; }

.note-block { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:12px; }
.note-text { font-size:13px; line-height:1.75; color:var(--text-secondary); }
.note-text p { margin-bottom:12px; }
.note-text p:last-child { margin-bottom:0; }

.chart-wrap { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; }
.chart-title { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
.chart-canvas { width:100%; }
.chart-container { position:relative; height:180px; width:100%; }
.chart-container-lg { position:relative; height:220px; width:100%; }

.archive-entry { border-bottom:1px solid var(--border); padding:14px 0; cursor:pointer; }
.archive-entry:last-child { border-bottom:none; }
.archive-month { font-family:'Cormorant Garamond',serif; font-size:15px; font-weight:600; }
.archive-preview { font-size:12px; color:var(--text-tertiary); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

.empty-state { text-align:center; padding:60px 20px; }
.empty-title { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; margin-bottom:12px; }
.empty-text { font-size:13px; color:var(--text-secondary); line-height:1.7; max-width:360px; margin:0 auto; }

.signal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 10px; }
.signal-badge { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 2px; padding: 4px 14px; border-radius: 4px; display: inline-block; margin-bottom: 14px; }
.signal-badge-red { background: var(--red-dim); color: var(--red); border: 1px solid rgba(207,92,92,0.35); }
.signal-badge-amber { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(232,168,56,0.35); }
.signal-badge-green { background: var(--green-dim); color: var(--green); border: 1px solid rgba(76,175,124,0.35); }
.signal-text { font-size: 13px; line-height: 1.75; color: var(--text-secondary); }

.up { color:var(--green); }
.down { color:var(--red); }
.flat { color:var(--text-tertiary); }
.hidden { display:none; }
.footer { margin-top:40px; padding-top:16px; border-top:1px solid var(--border); font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-tertiary); text-align:center; letter-spacing:0.3px; }

/* Overview page additions */
.chart-canvas-lg { height:220px; }
.vitals-position { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-tertiary); text-align:center; margin-bottom:14px; }
.month-row { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; text-decoration:none; color:var(--text-primary); transition:background 0.15s; }
.month-row:hover { background:var(--surface-hover); }
.month-row-name { font-family:'Cormorant Garamond',serif; font-size:15px; font-weight:600; }
.month-row-stats { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-tertiary); text-align:right; }
</style>
</head>
<body>
<div class="header">
  <div class="header-title">RILEY RESERVE</div>
  <div class="header-sub">DOMESTIC FISCAL OPERATIONS</div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-tertiary);letter-spacing:0.3px;margin-top:4px;">DRPC Members: Chris, Becca, Leslie, Charlie</div>
</div>
<div id="app"></div>
<div class="footer">Meridian Builds · Research Side of the Wall</div>

<script>
const $ = id => document.getElementById(id);

async function loadManifest(){
  try { const r = await fetch('data/index.json'); if(!r.ok) return []; return await r.json(); } catch { return []; }
}
async function loadMonth(m){
  try { const r = await fetch(`data/${m}.json`); if(!r.ok) return null; return await r.json(); } catch { return null; }
}

const DASHBOARD_RATES_URL = 'https://chrisrileyy91-gif.github.io/the-dashboard/dashboard_state/rates.json';

async function loadLiveMacro(){
  try {
    const r = await fetch(DASHBOARD_RATES_URL);
    if(!r.ok) return null;
    const d = await r.json();
    const t10 = d.treasury_10y?.yield_pct;
    const m30 = d.mortgage_30y?.rate_pct;
    const ff = d.fed?.rate;
    if(t10 == null && m30 == null && ff == null) return null;
    return { treasury_10y: t10, mortgage_30y: m30, fed_funds: ff };
  } catch {
    console.warn('Live macro fetch failed — using snapshot values');
    return null;
  }
}

function fmtPct(n,d=2){ return (n===null||n===undefined||isNaN(n))?'—':n.toFixed(d)+'%'; }
function fmtDollar(n){ return (n===null||n===undefined||isNaN(n))?'—':'$'+Math.round(n).toLocaleString('en-US'); }
function fmtDelta(n){ if(n===null||n===undefined||isNaN(n)) return ''; const s=n>=0?'+':'-'; return s+'$'+Math.abs(Math.round(n)).toLocaleString('en-US'); }
function fmtDeltaPct(n){ if(n===null||n===undefined||isNaN(n)) return ''; return (n>=0?'+':'')+n.toFixed(1)+'%'; }
function fmtMonthLabel(m){ const [y,mo]=m.split('-'); return new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(+y,+mo-1,1))); }
function fmtMonthShort(m){ const [y,mo]=m.split('-'); return new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(new Date(Date.UTC(+y,+mo-1,1)))+" '"+y.slice(2); }
function deltaClass(n){ return (n===null||n===undefined||isNaN(n))?'flat':n>0?'up':n<0?'down':'flat'; }

function renderEmpty(){
  $('app').innerHTML=`<div class="empty-state"><div class="empty-title">No data yet</div><div class="empty-text">Upload your first bank and mortgage statements in the Claude project. The extracted data arrives here as a monthly snapshot — no raw statements, no PII, just rates, balances, and the mechanism read.</div></div>`;
}

function savingsCat(d){ return d?.spending?.categories?.find(c=>c.name==='Savings & Investments')?.amount ?? null; }

/* ---- Section 2: Vitals ---- */
function renderVitals(allData, months){
  const rollingMonths = months.slice(-3);
  const rc = rollingMonths.length;
  const rollingStart = fmtMonthShort(rollingMonths[0]);
  const rollingEnd = fmtMonthShort(rollingMonths[rc - 1]);
  const rollingLabel = rc === 1 ? rollingStart : rollingStart + ' – ' + rollingEnd;

  const rollingIncome = rollingMonths.reduce((s, m) => s + (allData[m]?.income?.total || 0), 0) / rc;
  const rollingOutflows = rollingMonths.reduce((s, m) => s + (allData[m]?.spending?.total || 0), 0) / rc;
  const rollingSurplus = rollingIncome - rollingOutflows;
  const rollingSpendRate = (rollingOutflows / rollingIncome) * 100;
  const weeklyAmount = Math.ceil(Math.abs(rollingSurplus) / 4.33);
  const rollingSavingsRate = rollingMonths.reduce((s, m) => {
    const si = allData[m]?.spending?.categories?.find(c => c.name === 'Savings & Investments')?.amount || 0;
    const inc = allData[m]?.income?.total || 1;
    return s + (si / inc) * 100;
  }, 0) / rc;
  const rollingDebtService = rollingMonths.reduce((s, m) => s + (allData[m]?.debt_service?.total || 0), 0) / rc;
  const rollingDebtRatio = (rollingDebtService / rollingIncome) * 100;

  // Per-month detail rows for each vital (expanded on click)
  const incomeDetail = rollingLabel + ' · ' + rc + '-month avg<br>' +
    rollingMonths.map(m => fmtMonthShort(m) + ': ' + fmtDollar(allData[m]?.income?.total || 0) + '<br>').join('');
  const outflowsDetail = rollingLabel + ' · ' + rc + '-month avg<br>' +
    rollingMonths.map(m => fmtMonthShort(m) + ': ' + fmtDollar(allData[m]?.spending?.total || 0) + '<br>').join('');
  const surplusDetail = 'past 3 months<br>' +
    rollingMonths.map(m => {
      const ms = (allData[m]?.income?.total || 0) - (allData[m]?.spending?.total || 0);
      return fmtMonthShort(m) + ': <span class="' + (ms > 0 ? 'up' : 'down') + '">' + fmtDelta(ms) + '</span><br>';
    }).join('');
  const spendRateDetail = 'past 3 months<br>' +
    rollingMonths.map(m => {
      const mr = (allData[m]?.spending?.total || 0) / (allData[m]?.income?.total || 1) * 100;
      return fmtMonthShort(m) + ': <span class="' + (mr <= 100 ? 'up' : 'down') + '">' + mr.toFixed(1) + '%</span><br>';
    }).join('');
  const savingsRateDetail = 'target: 15-17%<br>' +
    rollingMonths.map(m => {
      const si = allData[m]?.spending?.categories?.find(c => c.name === 'Savings & Investments')?.amount || 0;
      const rate = si / (allData[m]?.income?.total || 1) * 100;
      const rateRounded = parseFloat(rate.toFixed(1));
      const cls = rateRounded < 15 ? 'down' : 'up';
      const label = rateRounded > 15 ? ' — exceeded target' : rateRounded === 15 ? ' — target hit' : ' — target not hit';
      return fmtMonthShort(m) + ': <span class="' + cls + '">' + rate.toFixed(1) + '%' + label + '</span><br>';
    }).join('');
  const debtServiceDetail = rollingLabel + ' · target: below 10%<br>' +
    rollingMonths.map(m => {
      const ds = allData[m]?.debt_service?.total || 0;
      const ratio = (ds / (allData[m]?.income?.total || 1) * 100);
      return fmtMonthShort(m) + ': <span class="' + (ratio < 10 ? 'up' : 'down') + '">' + fmtDollar(ds) + ' (' + ratio.toFixed(1) + '%)</span><br>';
    }).join('');

  // Latest-month position strip (all values pulled dynamically)
  const mr=allData[months[months.length-1]]||{};
  const apy=mr.savings?.apy, mrate=mr.mortgage?.rate, cpi=mr.macro_context?.cpi_yoy;
  const realYield=(apy!=null&&cpi!=null)?apy-cpi:null;
  const posParts=[];
  if(apy!=null) posParts.push(`Checking APY ${fmtPct(apy)}`);
  if(mrate!=null) posParts.push(`Mortgage ${fmtPct(mrate)} fixed`);
  if(realYield!=null) posParts.push(`Real yield ${realYield>=0?'+':''}${realYield.toFixed(1)}%`);

  return `
    <div class="section-head">Vitals · 3-Month Window</div>
    <div class="econ-grid">
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">ROLLING INCOME</div>
        <div class="econ-value">${fmtDollar(rollingIncome)} <span class="up" style="font-size:12px;font-weight:600;">IN</span></div>
        <div class="econ-sub">3-month average</div>
        <div class="econ-detail">${incomeDetail}</div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">ROLLING OUTFLOWS</div>
        <div class="econ-value">${fmtDollar(rollingOutflows)} <span class="down" style="font-size:12px;font-weight:600;">OUT</span></div>
        <div class="econ-sub">3-month average</div>
        <div class="econ-detail">${outflowsDetail}</div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">ROLLING SURPLUS</div>
        <div class="econ-value ${rollingSurplus > 0 ? 'up' : 'down'}">${fmtDelta(rollingSurplus)}</div>
        <div class="econ-sub">3-month average · ${rollingSurplus > 0 ? '<span class="up">Saving $' + weeklyAmount + '/w</span>' : '<span class="down">Trim $' + weeklyAmount + '/w</span>'}</div>
        <div class="econ-detail">${surplusDetail}</div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">SPENDING RATE</div>
        <div class="econ-value ${rollingSpendRate <= 100 ? 'up' : 'down'}">${rollingSpendRate.toFixed(1) + '%'}</div>
        <div class="econ-sub">3-month average · ${rollingSpendRate <= 100 ? '<span class="up">Saving $' + weeklyAmount + '/w</span>' : '<span class="down">Trim $' + weeklyAmount + '/w</span>'}</div>
        <div class="econ-detail">${spendRateDetail}</div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">INVESTMENTS</div>
        <div class="econ-value ${rollingSavingsRate >= 15 ? 'up' : rollingSavingsRate < 10 ? 'down' : ''}"${rollingSavingsRate >= 10 && rollingSavingsRate < 15 ? ' style="color:var(--gold)"' : ''}>${rollingSavingsRate.toFixed(1) + '%'}</div>
        <div class="econ-sub">3-month average · target: 15-17%</div>
        <div class="econ-detail">${savingsRateDetail}</div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">DEBT SERVICE</div>
        <div class="econ-value ${rollingDebtRatio < 10 ? 'up' : 'down'}">${fmtDollar(rollingDebtService)}</div>
        <div class="econ-sub">3-month average${rollingDebtRatio >= 10 ? ' · <span class="down">Trim</span>' : ''}</div>
        <div class="econ-detail">${debtServiceDetail}</div>
      </div>
    </div>
    ${posParts.length?`<div class="vitals-position">Current position: ${posParts.join(' · ')}</div>`:''}`;
}

/* ---- Section: no fed speak ---- */
function renderNoFedSpeak(allData, months, liveCtx){
  const rollingMonths = months.slice(-3);
  const rc = rollingMonths.length;
  const rollingIncome = rollingMonths.reduce((s, m) => s + (allData[m]?.income?.total || 0), 0) / rc;
  const rollingOutflows = rollingMonths.reduce((s, m) => s + (allData[m]?.spending?.total || 0), 0) / rc;
  const rollingSurplus = rollingIncome - rollingOutflows;
  const weeklyAmount = Math.ceil(Math.abs(rollingSurplus) / 4.33);

  const latest = allData[months[months.length - 1]];
  const mtg = latest?.mortgage || {};
  const sav = latest?.savings || {};
  const ctx = liveCtx || latest?.macro_context || {};
  const homeValue = mtg.home_value || 0;
  const equity = homeValue ? homeValue - (mtg.principal || 0) : null;
  const equityK = equity ? Math.round(equity / 1000) : null;
  const rateSpread = (ctx.mortgage_30y_market && mtg.rate) ? ctx.mortgage_30y_market - mtg.rate : null;
  const realYield = (sav.apy != null && ctx.cpi_yoy != null) ? sav.apy - ctx.cpi_yoy : null;
  const rollingSavingsRate = rollingMonths.reduce((s, m) => {
    const si = allData[m]?.spending?.categories?.find(c => c.name === 'Savings & Investments')?.amount || 0;
    const inc = allData[m]?.income?.total || 1;
    return s + (si / inc) * 100;
  }, 0) / rc;

  let signal, badgeClass, prose;
  if (rollingSurplus > 100) {
    signal = 'COMPOUND';
    badgeClass = 'signal-badge-green';
    prose = "You're saving $" + weeklyAmount + "/week above breakeven.";
    if (equityK) prose += " Home equity at $" + equityK + "K,";
    if (rateSpread) prose += " mortgage locked " + rateSpread.toFixed(1) + "% below market,";
    prose += " investments at " + rollingSavingsRate.toFixed(0) + "% of income.";
    if (realYield > 0) prose += " Real yield positive at +" + realYield.toFixed(1) + "%.";
    prose += " Every dollar above breakeven compounds. Keep the pace — you've built the foundation, now let it work.";
  } else if (rollingSurplus >= -100 && rollingSurplus <= 100) {
    signal = 'HOLD';
    badgeClass = 'signal-badge-amber';
    prose = "You're at the breakeven line — spending roughly matches income.";
    if (equityK) prose += " Home equity at $" + equityK + "K,";
    if (rateSpread) prose += " mortgage locked " + rateSpread.toFixed(1) + "% below market.";
    prose += " The position is stable but not growing. A small push — $" + weeklyAmount + "/week in either direction — flips the signal. You're closer than you think.";
  } else {
    signal = 'TIGHTEN';
    badgeClass = 'signal-badge-red';
    prose = "You're spending $" + weeklyAmount + "/week more than you earn. But the foundation is solid";
    if (equityK) prose += " — $" + equityK + "K in home equity";
    if (rateSpread) prose += ", a mortgage locked " + rateSpread.toFixed(1) + "% below market";
    prose += ", and " + rollingSavingsRate.toFixed(0) + "% of income flowing to investments.";
    prose += " The fix isn't structural, it's discretionary.";
    if (realYield > 0) prose += " Your checking beats inflation at +" + realYield.toFixed(1) + "%.";
    prose += " Your mortgage is insulated from rate moves, and your equity is growing. Tighten the weekly spend and the surplus flips green. You've built a position most households would envy — now it's about tightening the screws and letting it compound.";
  }

  return `
    <div class="section-head">No Fed Speak</div>
    <div class="signal-card">
      <div class="signal-badge ${badgeClass}">${signal}</div>
      <div class="signal-text">${prose}</div>
    </div>`;
}

/* ---- Section: Mortgage ---- */
function renderMortgage(allData, months, liveCtx){
  const latestMortgage = allData[months[months.length-1]]?.mortgage || {};
  const ctx = liveCtx || allData[months[months.length-1]]?.macro_context || {};
  const homeValue = latestMortgage.home_value || null;
  const equity = homeValue ? homeValue - (latestMortgage.principal || 0) : null;
  const ltv = homeValue ? ((latestMortgage.principal || 0) / homeValue * 100) : null;
  const marketRate = ctx.mortgage_30y_market || null;
  const rateSpread = (marketRate && latestMortgage.rate) ? marketRate - latestMortgage.rate : null;

  const origLoan = latestMortgage.original_loan || 130099;
  const purchasePrice = latestMortgage.purchase_price || origLoan;
  const totalPaidDown = origLoan - (latestMortgage.principal || 0);
  const mktRate = ctx.mortgage_30y_market || 0;
  const marketMonthlyInterest = Math.round((latestMortgage.principal || 0) * mktRate / 100 / 12);
  const yourMonthlyInterest = latestMortgage.interest_portion || 0;
  const monthlySavings = marketMonthlyInterest - yourMonthlyInterest;
  const annualSavings = monthlySavings * 12;
  const appreciationAmt = homeValue ? homeValue - purchasePrice : null;
  const equityPct = homeValue ? Math.round(equity / homeValue * 100) : null;
  const equityPctFromPI = latestMortgage.monthly_pi ? Math.round((latestMortgage.principal_portion || 0) / latestMortgage.monthly_pi * 100) : null;

  const principalDetail = months.map(m =>
    fmtMonthShort(m) + ': <span class="up">' + fmtDollar(allData[m]?.mortgage?.principal_portion || 0) + '</span><br>'
  ).join('') + 'Since origination: <span class="up">' + fmtDollar(totalPaidDown) + ' paid down</span>';

  const taxMo = latestMortgage.escrow_tax_monthly || 0;
  const fhaMo = latestMortgage.escrow_fha_monthly || 0;
  const hazardMo = latestMortgage.escrow_hazard_monthly || 0;

  return `
    <div class="section-head">Mortgage</div>
    <div class="econ-grid">
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">PRINCIPAL BALANCE</div>
        <div class="econ-value">${fmtDollar(latestMortgage.principal)}</div>
        <div class="econ-sub">from ${fmtDollar(origLoan)} · paid down ${fmtDollar(totalPaidDown)}</div>
        <div class="econ-detail">${principalDetail}</div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">FIXED RATE</div>
        <div class="econ-value up">${fmtPct(latestMortgage.rate)}</div>
        <div class="econ-sub">locked Sep 2019</div>
        <div class="econ-detail">Your interest: ${fmtDollar(yourMonthlyInterest)}/month<br>At today's ${fmtPct(mktRate)}: ${fmtDollar(marketMonthlyInterest)}/month<br>You save: <span class="up">${fmtDollar(monthlySavings)}/month · ${fmtDollar(annualSavings)}/year</span></div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">MONTHLY P&I</div>
        <div class="econ-value">${fmtDollar(latestMortgage.monthly_pi)}</div>
        <div class="econ-sub">${fmtDollar(latestMortgage.principal_portion)} principal · ${fmtDollar(latestMortgage.interest_portion)} interest</div>
        <div class="econ-detail"><span class="up">${fmtDollar(latestMortgage.principal_portion)}</span> builds equity (${equityPctFromPI}% of P&I)<br>${fmtDollar(yourMonthlyInterest)} to lender (${100 - equityPctFromPI}% of P&I)<br>Equity share rising each month as balance drops.</div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">ESCROW</div>
        <div class="econ-value">${fmtDollar(latestMortgage.escrow)}</div>
        <div class="econ-sub">taxes · FHA insurance · hazard insurance</div>
        <div class="econ-detail">Property tax: ~${fmtDollar(taxMo)}/month<br>FHA insurance: ~${fmtDollar(fhaMo)}/month<br>Hazard insurance: ~${fmtDollar(hazardMo)}/month</div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">HOME EQUITY</div>
        <div class="econ-value up">${equity ? fmtDollar(equity) : '—'}</div>
        <div class="econ-sub">Zestimate ${fmtDollar(homeValue)} · LTV ${ltv ? ltv.toFixed(0) + '%' : '—'}</div>
        <div class="econ-detail"><span class="up">${fmtDollar(totalPaidDown)}</span> from paydown<br>${appreciationAmt != null ? '<span class="up">' + fmtDollar(appreciationAmt) + '</span> from appreciation<br>' : ''}${equityPct ? equityPct + '% of home value owned outright' : ''}</div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">RATE ADVANTAGE</div>
        <div class="econ-value up">${rateSpread ? rateSpread.toFixed(2) + '%' : '—'}</div>
        <div class="econ-sub">${fmtPct(latestMortgage.rate)} locked vs ${fmtPct(marketRate)} market</div>
        <div class="econ-detail"><span class="up">${fmtDollar(monthlySavings)}</span> saved this month vs market rate<br><span class="up">${fmtDollar(annualSavings)}</span> saved per year</div>
      </div>
    </div>`;
}

/* ---- Section 3: Trend charts ---- */
let charts = {};

function renderCharts(){
  return `
    <div class="section-head">Trends</div>
    <div class="chart-wrap">
      <div class="chart-title">Income vs Spending</div>
      <div class="chart-container-lg"><canvas id="income-spend-chart" class="chart-canvas chart-canvas-lg"></canvas></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">INVESTMENTS</div>
      <div class="chart-container"><canvas id="savings-rate-chart" class="chart-canvas"></canvas></div>
    </div>`;
}

function mountCharts(allData, months){
  const labels=months.map(fmtMonthShort);
  const defaults={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:'rgba(255,255,255,0.4)',font:{family:"'JetBrains Mono',monospace",size:9},boxWidth:12,padding:10}}},scales:{x:{ticks:{color:'rgba(255,255,255,0.25)',font:{family:"'JetBrains Mono',monospace",size:9}},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'rgba(255,255,255,0.25)',font:{family:"'JetBrains Mono',monospace",size:9}},grid:{color:'rgba(255,255,255,0.04)'}}}};

  // Centerpiece: income line vs spending line
  const el0=document.getElementById('income-spend-chart');
  if(el0){
    charts.incomeSpend?.destroy();
    charts.incomeSpend=new Chart(el0,{type:'line',data:{labels,datasets:[
      {label:'Income',data:months.map(m=>allData[m]?.income?.total??null),borderColor:'#4caf7c',backgroundColor:'rgba(76,175,124,0.08)',fill:true,tension:0.3,pointRadius:3,borderWidth:2},
      {label:'Spending',data:months.map(m=>allData[m]?.spending?.total??null),borderColor:'#cf5c5c',backgroundColor:'rgba(207,92,92,0.08)',fill:true,tension:0.3,pointRadius:3,borderWidth:2}
    ]},options:{...defaults,scales:{...defaults.scales,y:{...defaults.scales.y,ticks:{...defaults.scales.y.ticks,callback:v=>'$'+(v/1000).toFixed(1)+'k'}}}}});
  }

  // Savings Rate
  const el1=document.getElementById('savings-rate-chart');
  if(el1){
    charts.savingsRate?.destroy();
    charts.savingsRate=new Chart(el1,{type:'line',data:{labels,datasets:[
      {label:'Investments',data:months.map(m=>{ const inc=allData[m]?.income?.total, sav=savingsCat(allData[m]); return (inc&&sav!=null)?(sav/inc)*100:null; }),borderColor:'#c9a54e',backgroundColor:'rgba(201,165,78,0.1)',fill:true,tension:0.3,pointRadius:3,borderWidth:2}
    ]},options:{...defaults,scales:{...defaults.scales,y:{...defaults.scales.y,ticks:{...defaults.scales.y.ticks,callback:v=>v.toFixed(1)+'%'}}}}});
  }
}

/* ---- Small Bank Credit Conditions card (replaces H.8 Banking when data present) ---- */
function fmtUpdatedDate(iso){
  if(!iso) return '';
  const parts = String(iso).split('-').map(Number);
  if(parts.length < 3 || parts.some(isNaN)) return '';
  const [y,mo,d] = parts;
  const mon = new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(new Date(Date.UTC(y,mo-1,d)));
  return 'Updated ' + mon + ' ' + d;
}

const SBC_REGIMES = {
  flush:    { kind:'green', color:'var(--green)' },
  fading:   { kind:'amber', color:'var(--amber)' },
  stressed: { kind:'red',   color:'var(--red)' }
};

function renderSmallBankCreditCell(sbc){
  const reg = SBC_REGIMES[sbc.regime] || SBC_REGIMES.fading;
  const regimeLabel = sbc.regime ? sbc.regime.charAt(0).toUpperCase() + sbc.regime.slice(1) : '—';
  const anchor = sbc.reserves_b != null ? '$' + sbc.reserves_b + 'B' : '—';
  const dv = sbc.delta_b;
  let deltaStr = '';
  if(dv != null && !isNaN(dv)){
    const arrow = dv < 0 ? '↓' : dv > 0 ? '↑' : '→';
    const sign = dv < 0 ? '−' : dv > 0 ? '+' : '';
    deltaStr = `<span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:${reg.color};margin-left:5px;">${arrow} ${sign}$${Math.abs(dv)}B</span>`;
  }
  const detail = sbc.detail
    ? sbc.detail.split('\n\n').map(p => '<p>' + p + '</p>').join('')
    : 'No detail recorded.';
  const updated = fmtUpdatedDate(sbc.updated);
  return `
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">SMALL BANK CREDIT CONDITIONS</div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:4px;">
          <div style="font-family:'JetBrains Mono',monospace;">
            <span style="font-size:20px;font-weight:700;color:var(--text-primary);">${anchor}</span>${deltaStr}
          </div>
          <span class="card-badge badge-${reg.kind}">${regimeLabel}</span>
        </div>
        ${sbc.summary ? `<div style="font-size:11px;color:var(--text-secondary);line-height:1.5;margin-top:6px;">${sbc.summary}</div>` : ''}
        ${updated ? `<div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-tertiary);text-align:right;margin-top:4px;">${updated}</div>` : ''}
        <div class="econ-detail">${detail}</div>
      </div>`;
}

/* ---- Section: macro backdrop ---- */
function renderMacroBackdrop(allData, months, liveCtx){
  const latest = allData[months[months.length-1]];
  const ctx = liveCtx || latest?.macro_context || {};
  const sav = latest?.savings || {};
  const mtg = latest?.mortgage || {};
  const marketRate = ctx.mortgage_30y_market || 0;
  const realYield = sav.apy != null && ctx.cpi_yoy != null ? sav.apy - ctx.cpi_yoy : null;
  const rateSpread = mtg.rate && marketRate ? marketRate - mtg.rate : null;

  const cpiStyle = ctx.cpi_yoy < 3 ? 'color:var(--green)' : ctx.cpi_yoy <= 4 ? 'color:var(--amber)' : 'color:var(--red)';

  const badges = [];
  if(ctx.sloos_summary) badges.push(`<span>SLOOS: ${ctx.sloos_summary}</span>`);
  if(ctx.qra_summary) badges.push(`<span>QRA: ${ctx.qra_summary}</span>`);
  const badgeRow = badges.length ? `<div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-tertiary);margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;">${badges.join('')}</div>` : '';

  return `
    <div class="section-head">Macro Backdrop</div>
    <div class="econ-grid">
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">FED FUNDS</div>
        <div class="econ-value" style="color:var(--gold)">${fmtPct(ctx.fed_funds)}</div>
        <div class="econ-detail">At ${fmtPct(ctx.fed_funds)}. A hike raises variable debt costs but likely pushes your ${fmtPct(sav.apy)} checking APY up.</div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">CPI</div>
        <div class="econ-value" style="${cpiStyle}">${fmtPct(ctx.cpi_yoy)}</div>
        <div class="econ-detail">Real yield: ${realYield != null ? fmtPct(realYield) : '—'} (checking ${fmtPct(sav.apy)} minus CPI). ${realYield != null && realYield > 0 ? 'Positive — purchasing power growing.' : 'Negative — inflation eroding deposits.'}</div>
      </div>
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">10Y TREASURY</div>
        <div class="econ-value">${fmtPct(ctx.treasury_10y)}</div>
        <div class="econ-detail">Drives mortgage pricing. Your ${fmtPct(mtg.rate)} locked ${rateSpread ? rateSpread.toFixed(1) + '%' : '—'} below market. Every rise widens your advantage.</div>
      </div>
      ${ctx.small_bank_credit ? renderSmallBankCreditCell(ctx.small_bank_credit) : `
      <div class="econ-cell" onclick="this.querySelector('.econ-detail').classList.toggle('open')">
        <div class="econ-label">H.8 BANKING</div>
        <div class="econ-value" style="font-size:11px">${ctx.h8_summary || '—'}</div>
        <div class="econ-detail">${latest?.reads?.macro_connection || 'No macro read for this month.'}</div>
      </div>`}
    </div>
    ${badgeRow}`;
}

/* ---- Section 4: month list ---- */
function renderMonths(allData, months){
  const rows=[...months].reverse().map(m=>{
    const d=allData[m]||{};
    const inc=d.income?.total ?? null, out=d.spending?.total ?? null;
    const net=(inc!=null&&out!=null)?inc-out:null;
    return `<a class="month-row" href="month.html?m=${m}">
      <span class="month-row-name">${fmtMonthLabel(m)}</span>
      <span class="month-row-stats">In: ${fmtDollar(inc)} · Out: ${fmtDollar(out)} · Net: <span class="${(net!=null&&net>=0)?'up':'down'}">${fmtDelta(net)}</span></span>
    </a>`;
  }).join('');
  return `<div class="section-head">Monthly Detail</div>${rows}`;
}

/* ---- Main ---- */
async function main(){
  // Fire the live macro fetch in parallel with the manifest load — it must not
  // add latency on top of the existing waterfall.
  const [manifest, liveMacro] = await Promise.all([loadManifest(), loadLiveMacro()]);
  if(manifest.length===0){ renderEmpty(); return; }
  const allData={};
  for(const m of manifest) allData[m]=await loadMonth(m);
  const months=[...manifest].sort();

  // Merge live values into a COPY of the latest snapshot's macro_context.
  // Never mutate allData or the snapshot objects — charts/time-series read them later.
  const latest = allData[months[months.length-1]];
  const snapshotCtx = latest?.macro_context || {};
  const liveCtx = { ...snapshotCtx };
  if(liveMacro){
    if(liveMacro.treasury_10y != null) liveCtx.treasury_10y = liveMacro.treasury_10y;
    if(liveMacro.mortgage_30y != null) liveCtx.mortgage_30y_market = liveMacro.mortgage_30y;
    if(liveMacro.fed_funds != null) liveCtx.fed_funds = liveMacro.fed_funds;
  }

  let html='';
  html+=renderVitals(allData,months);
  html+=renderNoFedSpeak(allData,months,liveCtx);
  html+=renderCharts();
  html+=renderMortgage(allData,months,liveCtx);
  html+=renderMacroBackdrop(allData,months,liveCtx);
  html+=renderMonths(allData,months);
  $('app').innerHTML=html;
  requestAnimationFrame(()=>mountCharts(allData,months));
}
main();
</script>
